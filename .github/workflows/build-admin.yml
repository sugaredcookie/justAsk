name: Build Admin Service

on:
  push:
    branches:
      - main
    paths:
      - 'api/admin-service/**'
      - '.github/workflows/build-admin.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository_owner }}/justask-admin:latest \
          ./api/admin-service

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/justask-admin:latest